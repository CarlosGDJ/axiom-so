<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="40" fill="#0f172a"/>
  <!-- Brain circuit inspired icon -->
  <g transform="translate(96,96)">
    <!-- Outer ring segments -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#334155" stroke-width="3"/>
    <!-- Circuit nodes -->
    <circle cx="-42" cy="0" r="5" fill="#6366f1"/>
    <circle cx="42" cy="0" r="5" fill="#6366f1"/>
    <circle cx="0" cy="-42" r="5" fill="#6366f1"/>
    <circle cx="0" cy="42" r="5" fill="#6366f1"/>
    <circle cx="-30" cy="-30" r="4" fill="#818cf8"/>
    <circle cx="30" cy="-30" r="4" fill="#818cf8"/>
    <circle cx="-30" cy="30" r="4" fill="#818cf8"/>
    <circle cx="30" cy="30" r="4" fill="#818cf8"/>
    <!-- Circuit lines -->
    <line x1="-42" y1="0" x2="-30" y2="-30" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-30" y1="-30" x2="0" y2="-42" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-42" x2="30" y2="-30" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="-30" x2="42" y2="0" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="42" y1="0" x2="30" y2="30" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="0" y2="42" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="42" x2="-30" y2="30" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-30" y1="30" x2="-42" y2="0" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Inner cross lines -->
    <line x1="-30" y1="-30" x2="0" y2="0" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="30" y1="-30" x2="0" y2="0" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-30" y1="30" x2="0" y2="0" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="30" y1="30" x2="0" y2="0" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Center node -->
    <circle cx="0" cy="0" r="10" fill="#6366f1"/>
    <circle cx="0" cy="0" r="5" fill="#a5b4fc"/>
  </g>
  <!-- Axiom "A" letterform subtle hint -->
  <text x="96" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="4" opacity="0.7">AXIOM</text>
</svg>
